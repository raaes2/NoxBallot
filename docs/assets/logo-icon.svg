<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#06080F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="#06080F" />
  <circle cx="256" cy="240" r="210" fill="url(#bgGlow)" />

  <!-- Shield Outer Glow -->
  <path
    d="M256 56 L88 136 V248 C88 356 164 438 256 464 C348 438 424 356 424 248 V136 Z"
    fill="none"
    stroke="url(#shieldGrad)"
    stroke-width="12"
    stroke-opacity="0.4"
    filter="url(#glow)"
  />

  <!-- Shield Base -->
  <path
    d="M256 56 L88 136 V248 C88 356 164 438 256 464 C348 438 424 356 424 248 V136 Z"
    fill="url(#innerGlow)"
    stroke="url(#shieldGrad)"
    stroke-width="16"
    stroke-linejoin="round"
  />

  <!-- Ballot Slot -->
  <path
    d="M176 186 H336"
    stroke="#00F5A0"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Sealed Ballot Entering Slot -->
  <rect
    x="218"
    y="120"
    width="76"
    height="84"
    rx="12"
    fill="#00F5A0"
    fill-opacity="0.95"
  />
  <!-- Ballot Fold Line Accent -->
  <line x1="234" y1="146" x2="278" y2="146" stroke="#04140E" stroke-width="4" stroke-linecap="round" />
  <line x1="234" y1="162" x2="264" y2="162" stroke="#04140E" stroke-width="4" stroke-linecap="round" />

  <!-- Central Keyhole Secrecy Core -->
  <circle
    cx="256"
    cy="298"
    r="36"
    stroke="#F8FAFC"
    stroke-width="20"
    fill="none"
  />
  <path
    d="M256 334 V374"
    stroke="#F8FAFC"
    stroke-width="20"
    stroke-linecap="round"
  />
</svg>
